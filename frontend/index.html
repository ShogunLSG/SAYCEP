<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAYCEP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="root"></div>
  <noscript>SAYCEP needs JavaScript to run.</noscript>
  <!-- React, no build step (proposal Q3.1). htm stands in for JSX so nothing
       needs compiling. Vendored locally in frontend/vendor/ rather than
       pulled from a CDN, so the demo doesn't depend on the venue's wifi —
       see docs/plans/frontend-journey.md. Each falls back to the CDN only
       if the local copy is somehow missing. -->
  <script src="/static/vendor/react.production.min.js" onerror="this.onerror=null;document.write('<script src=https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js><\/script>')"></script>
  <script src="/static/vendor/react-dom.production.min.js" onerror="this.onerror=null;document.write('<script src=https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js><\/script>')"></script>
  <script src="/static/vendor/htm.umd.js" onerror="this.onerror=null;document.write('<script src=https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js><\/script>')"></script>
  <!-- Plain scripts sharing globals, no build step: shared pieces and the
       journey, then one file per part of the app, then main.js to mount. -->
  <script src="/static/app.js"></script>
  <script src="/static/job.js"></script>
  <script src="/static/welcome.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
